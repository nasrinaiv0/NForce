name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Core tests with coverage thresholds
        run: npm run test:coverage -w @nforce/core
      - name: App tests
        run: npm run test -w @nforce/mobile

  database:
    name: Database migrations & RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and SQL tests on a throwaway PostgreSQL
        run: ./scripts/test-db.sh

  web-bundle:
    name: App bundle (web export)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
        working-directory: apps/mobile

  isolated-acceptance:
    name: Isolated browser · native JS exports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: ""
      EXPO_PUBLIC_SUPABASE_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export iOS and Android bundles (not native builds)
        working-directory: apps/mobile
        run: |
          npx expo export --platform ios --output-dir /tmp/nforce-ios
          npx expo export --platform android --output-dir /tmp/nforce-android
      - name: Export isolated fictional-data web app
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist
      - name: Install pinned browser harness
        run: |
          npm install --prefix /tmp/nforce-browser --no-audit --no-fund --save-exact playwright@1.56.1
          /tmp/nforce-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Render and test phone and desktop
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/mobile/dist > /tmp/nforce-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" || true' EXIT
          mkdir -p /tmp/nforce-browser/screenshots
          cp scripts/p0-6-browser-smoke.cjs /tmp/nforce-browser/smoke.cjs
          node /tmp/nforce-browser/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-6-isolated-browser-screenshots
          path: /tmp/nforce-browser/screenshots/
          retention-days: 7
          if-no-files-found: warn
